# 依赖更新（Dependabot）。
#
# 只开两个生态，另两个是**故意**不开的：
# - npm（/web）：前端依赖跟着浏览器生态走，补丁必须及时。这是主要目标。
# - github-actions（/）：action 的 major 升级常带破坏性变更，早看到早改。
# - gomod（/server）不开：后端只用标准库（server/go.mod 里没有任何 require），开了只会产生
#   「go 指令版本」这类噪音 PR。哪天真加了第三方依赖，把文件末尾注释里的那段打开。
# - nuget（/plugin/WebUI）不开：插件引用的 TShock 必须与服务端版本一致（目标 TShock 6.2.1 /
#   Terraria 1.4.5.8），升这个库等于换目标游戏版本 —— 那是一次「数据再生成 + 真机验收」的迁移，
#   不是一次依赖更新。要升就手动升，并同步 docs/开发速查.md 与 docs/ 里的版本号。
version: 2
updates:
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    # 同时最多 3 条（minor/patch 组 1 条 + major 2 条）：多了看不过来，
    # 真正坏了的那条反而被一堆红灯淹没。
    open-pull-requests-limit: 3
    commit-message:
      prefix: chore(deps)
      prefix-development: chore(deps-dev)
    labels:
      - dependencies
    # minor + patch 合成一条 PR（不然一周能来十条）；major 各占一条，必须单独看。
    groups:
      npm-minor-patch:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
    # 这四个包的 major 在本仓库都是「一次迁移」而不是「一次升级」，静音掉，等有空手动做：
    # - typescript 6→7：类型检查口径会变，全仓 tsc -b 得重跑一轮
    # - jsdom 30→31：全部 DOM 用例的运行时，先读 breaking changes
    # - @types/node 24→26：与 TypeScript / Node 目标版本绑定，要一起动
    # - react-resizable-panels 2→4：跨大版本重写（指令页两栏分隔条），不是换个号的事
    # 其它包（React / Vite / Tailwind / lucide 等）的 major 仍然会来 PR，按 docs/开发速查.md 的合并标准处理。
    ignore:
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
      - dependency-name: jsdom
        update-types:
          - version-update:semver-major
      - dependency-name: '@types/node'
        update-types:
          - version-update:semver-major
      - dependency-name: react-resizable-panels
        update-types:
          - version-update:semver-major

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # action 的 major 仍单独来（要读 release notes），但 minor/patch 合一条，总共最多 2 条。
    open-pull-requests-limit: 2
    commit-message:
      prefix: chore(ci)
    labels:
      - dependencies
    groups:
      gha-minor-patch:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
